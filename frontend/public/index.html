<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f2f2f7" id="theme-color-meta">
    <title>GymCore</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" href="/assets/icons/icon.png">
    <link rel="apple-touch-icon" href="/assets/icons/icon.png">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
    <header class="app-header">
        <h1>GymCore</h1>
        <button id="themeToggleBtn" class="icon-btn">🌓</button>
    </header>

    <main id="app-container" class="app-content"></main>

    <div id="globalActiveWorkout" class="global-active-workout" style="display: none;">
        <div class="active-workout-info">
            <span class="active-dot"></span>
            <div>
                <div class="active-title" id="globalWorkoutTitle">Тренировка</div>
                <div class="active-time" id="globalWorkoutTimer">00:00</div>
            </div>
        </div>
        <button class="icon-btn" style="color: var(--text-secondary); font-size: 20px;">↑</button>
    </div>

    <nav class="bottom-nav" id="bottomNav" style="display: none;">
        <a href="#" class="nav-item" data-path="">
            <span class="nav-icon">🕒</span>
            <span>История</span>
        </a>
        <a href="#templates" class="nav-item" data-path="#templates">
            <span class="nav-icon">🏋️</span>
            <span>Тренировка</span>
        </a>
        <a href="#exercises" class="nav-item" data-path="#exercises">
            <span class="nav-icon">📚</span>
            <span>Упражнения</span>
        </a>
        <a href="#profile" class="nav-item" data-path="#profile">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </a>
    </nav>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
